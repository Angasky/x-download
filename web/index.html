<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>x-download · 视频解析</title>
  <link rel="icon" href="/assets/x-download-mark.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a10;
      --surface: rgba(19, 22, 33, 0.88);
      --surface-strong: #171a25;
      --surface-soft: #10131c;
      --line: rgba(255, 255, 255, 0.09);
      --line-strong: rgba(255, 255, 255, 0.16);
      --ink: #f6f7fb;
      --muted: #9299aa;
      --accent: #8b78ff;
      --accent-strong: #a99cff;
      --accent-soft: rgba(139, 120, 255, 0.14);
      --ok: #55d6a9;
      --bad: #ff7b89;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body { margin: 0; min-height: 100vh; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(900px 520px at 12% -12%, rgba(118, 84, 255, 0.24), transparent 62%),
        radial-gradient(700px 500px at 92% 5%, rgba(29, 202, 166, 0.12), transparent 64%),
        var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100% - 40px, 1040px);
      margin: 0 auto;
      padding: 72px 0 56px;
    }
    .hero { max-width: 760px; margin-bottom: 32px; }
    .hero-logo { display:block; width:min(350px,78vw); height:auto; margin:0 0 24px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 16px var(--ok);
      content: "";
    }
    header h1 {
      max-width: 700px;
      margin: 0;
      font-size: clamp(36px, 6vw, 62px);
      line-height: 1.08;
      letter-spacing: -0.045em;
    }
    header h1 span {
      color: transparent;
      background: linear-gradient(110deg, #b5aaff, #66e2c2);
      background-clip: text;
      -webkit-background-clip: text;
    }
    header p {
      max-width: 650px;
      margin: 18px 0 0;
      color: #b3b8c6;
      font-size: 17px;
      line-height: 1.75;
    }
    .platforms { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .platforms span {
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.025);
      color: #aeb4c2;
      font-size: 12px;
    }
    .workspace {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .workspace-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    .workspace-title { font-size: 14px; font-weight: 700; }
    .status { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.035);
      font-size: 11px;
      white-space: nowrap;
    }
    .pill::before { width: 5px; height: 5px; border-radius: 50%; background: currentColor; content: ""; }
    .pill.ok { color: var(--ok); background: rgba(85, 214, 169, 0.08); }
    .pill.bad { color: var(--bad); background: rgba(255, 123, 137, 0.09); }
    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 7px;
      border: 1px solid var(--line-strong);
      border-radius: 15px;
      background: var(--surface-soft);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    form:focus-within { border-color: rgba(139, 120, 255, 0.7); box-shadow: 0 0 0 4px var(--accent-soft); }
    input[type="url"], input[type="text"] {
      width: 100%;
      background: transparent;
      border: 0;
      color: var(--ink);
      font-size: 15px;
      outline: none;
      padding: 13px 14px;
    }
    input::placeholder { color: #666d7e; }
    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }
    #go {
      min-width: 116px;
      padding: 11px 20px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #6e59ef);
      color: white;
      font-weight: 750;
      box-shadow: 0 8px 24px rgba(111, 87, 239, 0.24);
      transition: transform 0.18s, filter 0.18s;
    }
    #go:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
    #go:disabled { opacity: 0.68; cursor: wait; }
    .hint { display: flex; gap: 7px; margin: 12px 2px 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .hint::before { content: "ⓘ"; color: var(--accent-strong); }
    .error {
      margin-top: 16px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 123, 137, 0.25);
      border-radius: 12px;
      background: rgba(255, 123, 137, 0.08);
      color: #ffc1c8;
      font-size: 13px;
      line-height: 1.6;
    }
    .error strong { display: block; margin-bottom: 2px; color: #fff0f2; font-size: 14px; }
    .result[hidden] { display: none; }
    .result {
      margin-top: 22px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: reveal 0.35s ease both;
    }
    @keyframes reveal { from { opacity: 0; transform: translateY(8px); } }
    .result-content { padding: 24px 24px 20px; }
    .result-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; }
    .meta { min-width: 0; }
    .meta h2 { margin: 8px 0 0; font-size: clamp(20px, 3vw, 28px); line-height: 1.35; letter-spacing: -0.025em; }
    .platform-badge {
      display: inline-flex;
      padding: 5px 9px;
      border: 1px solid rgba(139, 120, 255, 0.22);
      border-radius: 7px;
      background: var(--accent-soft);
      color: #b9afff;
      font-size: 11px;
      font-weight: 700;
    }
    .result-note { flex: 0 0 auto; color: var(--muted); font-size: 12px; }
    .author-card {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    .avatar { width: 46px; height: 46px; flex: 0 0 46px; border: 1px solid var(--line); border-radius: 50%; object-fit: cover; background: #252936; }
    .avatar-placeholder { display: grid; place-items: center; color: var(--muted); font-weight: 700; }
    .author-info { min-width: 0; flex: 1; }
    .author-name { font-size: 14px; font-weight: 750; }
    .author-name a { color: var(--ink); text-decoration: none; }
    .author-name a:hover { color: var(--accent-strong); }
    .author-id { margin-top: 3px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .author-signature { margin-top: 7px; color: #afb5c3; font-size: 12px; line-height: 1.55; white-space: pre-wrap; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 20px; }
    .stat { padding: 12px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255, 255, 255, 0.025); }
    .stat strong { display: block; font-size: 17px; line-height: 1.2; }
    .stat span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .caption { margin-top: 18px; padding: 15px 16px; border-radius: 12px; background: rgba(255, 255, 255, 0.025); color: #c7cbd5; font-size: 13px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
    .caption-label, .section-kicker { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .media-shell { position: relative; background: #030406; border-block: 1px solid var(--line); }
    video, img.cover { width: 100%; max-height: 590px; display: block; background: #000; object-fit: contain; }
    .gallery-head { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 20px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; }
    .gallery-head strong { color:var(--ink); font-size:14px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; padding: 8px; }
    .gallery-item { position:relative; min-width:0; margin:0; overflow:hidden; border:1px solid var(--line); border-radius:13px; background:#080a0f; }
    .gallery-item img { width: 100%; aspect-ratio: 3 / 4; display:block; object-fit: cover; transition:transform .25s ease; }
    .gallery-item:hover img { transform:scale(1.015); }
    .gallery-index { position:absolute; top:10px; left:10px; padding:5px 8px; border:1px solid rgba(255,255,255,.14); border-radius:7px; background:rgba(8,10,16,.78); color:#fff; font-size:11px; backdrop-filter:blur(10px); }
    .gallery-download { position:absolute; right:10px; bottom:10px; left:10px; display:flex; align-items:center; justify-content:center; min-height:40px; border:1px solid rgba(255,255,255,.18); border-radius:9px; background:rgba(13,15,23,.9); color:#fff; font-size:12px; font-weight:750; text-decoration:none; box-shadow:0 10px 28px rgba(0,0,0,.38); backdrop-filter:blur(12px); transition:background .18s,transform .18s; }
    .gallery-download:hover { background:linear-gradient(135deg,var(--accent),#6e59ef); transform:translateY(-1px); }
    .download-panel { padding: 22px 24px 24px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
    .section-head h3 { margin: 0; font-size: 16px; }
    .section-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .quality-buttons { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
    .quality-option {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-soft);
      color: var(--ink);
      text-align: left;
      transition: border-color 0.18s, background 0.18s, transform 0.18s;
    }
    .quality-option:hover { border-color: rgba(139, 120, 255, 0.55); transform: translateY(-1px); }
    .quality-option:disabled { opacity:.45; cursor:not-allowed; transform:none; }
    .quality-option.active { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px rgba(139, 120, 255, 0.14); }
    .quality-option.active::after { position: absolute; top: 10px; right: 11px; color: var(--accent-strong); font-size: 13px; content: "✓"; }
    .quality-option > span { padding-right: 18px; font-size: 14px; font-weight: 750; }
    .quality-option small { max-width: 100%; color: var(--muted); font-size: 10px; line-height: 1.45; font-weight: 500; overflow-wrap: anywhere; }
    .quality-option.active small { color: #aaa1dc; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
    .actions a { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 10px 16px; border-radius: 10px; background: var(--ink); color: #11131a; font-size: 13px; font-weight: 750; text-decoration: none; transition: transform 0.18s, filter 0.18s; }
    .actions a:hover { transform: translateY(-1px); filter: brightness(0.92); }
    .actions a.primary { background: linear-gradient(135deg, var(--accent), #6e59ef); color: white; }
    .actions a.ghost { border: 1px solid var(--line-strong); background: transparent; color: #c6cad4; }
    .download-progress {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 20;
      width: min(350px, calc(100vw - 32px));
      padding: 18px;
      border: 1px solid rgba(139, 120, 255, 0.35);
      border-radius: 16px;
      background: rgba(18, 21, 31, 0.96);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      animation: progress-in 0.28s ease both;
    }
    .download-progress[hidden] { display: none; }
    @keyframes progress-in { from { opacity: 0; transform: translateX(12px); } }
    .progress-head { display: flex; align-items: center; gap: 11px; }
    .progress-symbol { display: grid; width: 36px; height: 36px; flex: 0 0 36px; place-items: center; border-radius: 11px; background: var(--accent-soft); color: var(--accent-strong); font-size: 18px; }
    .download-progress.active .progress-symbol { animation: progress-pulse 1.4s ease-in-out infinite; }
    @keyframes progress-pulse { 50% { box-shadow: 0 0 0 7px rgba(139, 120, 255, 0.08); } }
    .progress-copy { min-width: 0; flex: 1; }
    .progress-copy strong { display: block; font-size: 14px; }
    .progress-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .progress-close { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 8px; background: transparent; color: var(--muted); font-size: 18px; }
    .progress-close:hover { background: rgba(255, 255, 255, 0.06); color: var(--ink); }
    .progress-track { height: 7px; margin-top: 16px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
    .progress-fill { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), #64dfbf); transition: width 0.35s ease; }
    .progress-summary { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 10px; }
    .progress-percent { font-size: 24px; font-weight: 800; letter-spacing: -0.04em; }
    .progress-size { color: var(--muted); font-size: 11px; }
    .progress-metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .progress-metric { padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255, 255, 255, 0.025); }
    .progress-metric span { display: block; color: var(--muted); font-size: 9px; }
    .progress-metric strong { display: block; margin-top: 3px; font-size: 12px; }
    .download-progress.error { border-color: rgba(255, 123, 137, 0.35); }
    .download-progress.error .progress-symbol { color: var(--bad); background: rgba(255, 123, 137, 0.1); }
    .progress-error { margin: 12px 0 0; color: #ffc1c8; font-size: 11px; line-height: 1.55; overflow-wrap: anywhere; }
    .progress-error:empty { display: none; }
    footer { display: flex; justify-content: space-between; gap: 24px; margin-top: 28px; color: #696f7e; font-size: 11px; line-height: 1.7; }
    footer a { color: #9299aa; text-decoration: none; }
    footer a:hover { color: var(--ink); }
    @media (max-width: 760px) {
      main { width: min(100% - 28px, 1040px); padding-top: 46px; }
      .workspace-head { align-items: flex-start; flex-direction: column; }
      .status { justify-content: flex-start; }
      .quality-buttons { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      main { width: min(100% - 20px, 1040px); padding: 34px 0 32px; }
      header h1 { font-size: 37px; }
      header p { font-size: 14px; }
      .workspace { padding: 14px; border-radius: 17px; }
      form { grid-template-columns: 1fr; }
      #go { width: 100%; }
      .result { border-radius: 17px; }
      .result-content, .download-panel { padding: 18px 16px; }
      .result-heading { flex-direction: column; gap: 8px; }
      .result-note { display: none; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .quality-buttons { grid-template-columns: 1fr; }
      .actions a { flex: 1 1 100%; }
      .download-progress { top: auto; right: 10px; bottom: 10px; left: 10px; width: auto; padding: 15px; }
      @keyframes progress-in { from { opacity: 0; transform: translateY(12px); } }
      footer { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <img class="hero-logo" src="/assets/x-download-logo.svg" alt="x-download" />
      <div class="eyebrow">多平台媒体工具箱</div>
      <h1>一个链接，<br /><span>保存你需要的内容</span></h1>
      <p>粘贴视频或图集链接，即刻查看作品信息、可用清晰度与文件大小，并下载适合你的版本。</p>
      <div class="platforms" aria-label="支持的平台">
        <span>抖音</span><span>快手</span><span>TikTok</span><span>YouTube</span><span>哔哩哔哩</span><span>X</span><span>更多 yt-dlp 平台</span>
      </div>
    </header>
    <section class="workspace" aria-label="视频链接解析">
      <div class="workspace-head">
        <span class="workspace-title">粘贴作品链接</span>
        <div class="status" id="status" aria-label="服务状态"></div>
      </div>
      <form id="form">
        <input id="url" type="url" placeholder="在这里粘贴抖音、B站、YouTube 等作品链接" required autocomplete="off" aria-label="作品链接" />
        <button type="submit" id="go">开始解析</button>
      </form>
      <p class="hint">链接只用于本次解析；部分平台需要先在启动配置中填写 Cookie。</p>
    </section>
    <div id="msg"></div>
    <section class="result" id="result" hidden></section>
    <aside class="download-progress" id="download-progress" aria-live="polite" hidden>
      <div class="progress-head">
        <span class="progress-symbol" id="progress-symbol" aria-hidden="true">↓</span>
        <div class="progress-copy">
          <strong id="progress-title">正在准备下载</strong>
          <span id="progress-phase">正在创建下载任务</span>
        </div>
        <button class="progress-close" id="progress-close" type="button" aria-label="收起下载进度">×</button>
      </div>
      <div class="progress-track" role="progressbar" aria-label="下载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="progress-fill" id="progress-fill"></span>
      </div>
      <div class="progress-summary">
        <strong class="progress-percent" id="progress-percent">0%</strong>
        <span class="progress-size" id="progress-size">正在计算文件大小</span>
      </div>
      <div class="progress-metrics">
        <div class="progress-metric"><span>当前速度</span><strong id="progress-speed">—</strong></div>
        <div class="progress-metric"><span>预计剩余</span><strong id="progress-eta">—</strong></div>
      </div>
      <p class="progress-error" id="progress-error"></p>
    </aside>
    <footer>
      <span>请仅下载和使用你拥有权利的内容。</span>
      <span>Powered by DouK-Downloader · tikwm · yt-dlp</span>
    </footer>
  </main>
  <script>
    const statusEl = document.getElementById("status");
    const form = document.getElementById("form");
    const urlEl = document.getElementById("url");
    const go = document.getElementById("go");
    const msg = document.getElementById("msg");
    const result = document.getElementById("result");
    const progressPanel = document.getElementById("download-progress");
    const progressTitle = document.getElementById("progress-title");
    const progressPhase = document.getElementById("progress-phase");
    const progressSymbol = document.getElementById("progress-symbol");
    const progressFill = document.getElementById("progress-fill");
    const progressPercent = document.getElementById("progress-percent");
    const progressSize = document.getElementById("progress-size");
    const progressSpeed = document.getElementById("progress-speed");
    const progressEta = document.getElementById("progress-eta");
    const progressError = document.getElementById("progress-error");
    const progressTrack = progressPanel.querySelector("[role=progressbar]");
    let activeDownloadJob = "";
    let activeDownloadState = "";
    let progressTimer = null;
    let parsing = false;

    function pill(text, cls) {
      const s = document.createElement("span");
      s.className = "pill " + (cls || "");
      s.textContent = text;
      return s;
    }

    async function loadHealth() {
      try {
        const r = await fetch("/api/health");
        const h = await r.json();
        statusEl.innerHTML = "";
        statusEl.append(
          pill(h.douk_downloader ? "抖音解析可用" : "抖音组件缺失", h.douk_downloader ? "ok" : "bad"),
          pill(h.yt_dlp ? "通用解析可用" : "通用组件缺失", h.yt_dlp ? "ok" : "bad"),
          pill(h.douyin_cookie ? "抖音已配置" : "抖音未配置", h.douyin_cookie ? "ok" : "bad"),
          pill(h.ytdlp_cookies_file ? "yt-dlp Cookie 已配置" : "YouTube / X Cookie 可选", h.ytdlp_cookies_file ? "ok" : ""),
          pill(h.ffmpeg ? "音视频合并可用" : "未安装 ffmpeg", h.ffmpeg ? "ok" : "")
        );
      } catch {
        statusEl.innerHTML = "";
        statusEl.append(pill("服务连接失败", "bad"));
      }
    }

    function streamUrl(u, download, format, filename) {
      const params = new URLSearchParams({ url: u });
      const headers = format?.http_headers || {};
      if (download) params.set("download", "1");
      if (filename) params.set("filename", filename);
      if (headers.Referer) params.set("referer", headers.Referer);
      if (headers["User-Agent"]) params.set("user_agent", headers["User-Agent"]);
      if (headers.Origin) params.set("origin", headers.Origin);
      return "/api/stream?" + params.toString();
    }

    function downloadUrl(source, format) {
      if (needsProgressDownload(source, format)) {
        const params = new URLSearchParams({
          url: source,
          format_id: format.format_id,
          merge_audio: "1",
        });
        return "/api/ytdlp-download?" + params.toString();
      }
      return streamUrl(format?.url || "", true, format);
    }

    function needsProgressDownload(source, format) {
      return Boolean(source && format?.format_id && format.acodec === "none");
    }

    document.getElementById("progress-close").addEventListener("click", () => {
      progressPanel.hidden = true;
    });

    async function startProgressDownload(source, format) {
      if (activeDownloadJob && ["queued", "downloading", "merging"].includes(activeDownloadState)) {
        progressPanel.hidden = false;
        return;
      }
      if (progressTimer) clearTimeout(progressTimer);
      activeDownloadJob = "";
      activeDownloadState = "queued";
      progressPanel.hidden = false;
      progressPanel.className = "download-progress active";
      progressTitle.textContent = "正在准备下载";
      progressPhase.textContent = "正在创建音视频合并任务";
      progressSymbol.textContent = "↓";
      progressFill.style.width = "0%";
      progressPercent.textContent = "0%";
      progressSize.textContent = format.sizeLabel || "正在计算文件大小";
      progressSpeed.textContent = "—";
      progressEta.textContent = "—";
      progressError.textContent = "";
      progressTrack.setAttribute("aria-valuenow", "0");
      try {
        const response = await fetch("/api/download-jobs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: source, format_id: format.format_id, merge_audio: true }),
        });
        const job = await response.json();
        if (!response.ok || !job.job_id) throw new Error(job.error || "无法创建下载任务");
        activeDownloadJob = job.job_id;
        renderDownloadProgress(job);
        scheduleProgressPoll(250);
      } catch (error) {
        showProgressError(error.message || error);
      }
    }

    function scheduleProgressPoll(delay) {
      if (progressTimer) clearTimeout(progressTimer);
      progressTimer = setTimeout(pollDownloadProgress, delay);
    }

    async function pollDownloadProgress() {
      if (!activeDownloadJob) return;
      try {
        const response = await fetch("/api/download-jobs/" + encodeURIComponent(activeDownloadJob), { cache: "no-store" });
        const job = await response.json();
        if (!response.ok) throw new Error(job.error || "无法读取下载进度");
        renderDownloadProgress(job);
        if (job.status === "ready" && job.download_url) {
          const fileLink = document.createElement("a");
          fileLink.href = job.download_url;
          fileLink.style.display = "none";
          document.body.appendChild(fileLink);
          fileLink.click();
          fileLink.remove();
          activeDownloadJob = "";
          return;
        }
        if (job.status === "error") {
          showProgressError(job.error || "下载处理失败");
          activeDownloadJob = "";
          return;
        }
        scheduleProgressPoll(500);
      } catch (error) {
        showProgressError(error.message || error);
        activeDownloadJob = "";
      }
    }

    function renderDownloadProgress(job) {
      const percent = Math.max(0, Math.min(100, Number(job.percent) || 0));
      activeDownloadState = job.status || "queued";
      progressPanel.hidden = false;
      progressPanel.className = "download-progress " + (job.status === "ready" ? "complete" : "active");
      progressTitle.textContent = job.status === "ready" ? "文件已经准备完成" : "正在处理所选清晰度";
      progressPhase.textContent = job.phase || "正在处理";
      progressSymbol.textContent = job.status === "ready" ? "✓" : "↓";
      progressFill.style.width = percent + "%";
      progressPercent.textContent = Math.round(percent) + "%";
      progressTrack.setAttribute("aria-valuenow", String(Math.round(percent)));
      const downloaded = Number(job.downloaded_bytes) || 0;
      const total = Number(job.total_bytes) || 0;
      progressSize.textContent = total
        ? formatBytes(downloaded) + " / " + formatBytes(total)
        : (downloaded ? "已下载 " + formatBytes(downloaded) : "正在计算文件大小");
      progressSpeed.textContent = job.speed ? formatBytes(job.speed) + "/s" : "—";
      progressEta.textContent = formatEta(job.eta);
      progressError.textContent = "";
    }

    function showProgressError(message) {
      if (progressTimer) clearTimeout(progressTimer);
      activeDownloadState = "error";
      progressPanel.hidden = false;
      progressPanel.className = "download-progress error";
      progressTitle.textContent = "下载没有完成";
      progressPhase.textContent = "请检查服务状态后重试";
      progressSymbol.textContent = "!";
      progressSpeed.textContent = "—";
      progressEta.textContent = "—";
      progressError.textContent = String(message || "未知错误");
    }

    function formatEta(value) {
      const seconds = Math.max(0, Math.round(Number(value)));
      if (!Number.isFinite(seconds) || !seconds) return "—";
      if (seconds < 60) return seconds + " 秒";
      return Math.floor(seconds / 60) + " 分 " + (seconds % 60) + " 秒";
    }

    function normalizeSubmittedUrl(value) {
      const source = String(value || "").trim();
      try {
        const parsed = new URL(source);
        if (/(^|\.)(x\.com|twitter\.com)$/i.test(parsed.hostname)) {
          const match = parsed.pathname.match(/^\/([^/]+)\/status\/(\d{2,20})(?:\/(?:photo|video)\/\d+)?\/?$/i);
          return match ? "https://x.com/" + match[1] + "/status/" + match[2] + "/" : source;
        }
        if (/(^|\.)instagram\.com$/i.test(parsed.hostname)) {
          const match = parsed.pathname.match(/^\/(p|reel|tv)\/([^/]+)\/?$/i);
          return match ? "https://www.instagram.com/" + match[1].toLowerCase() + "/" + match[2] + "/" : source;
        }
        return source;
      } catch {
        return source;
      }
    }

    async function readJsonResponse(response) {
      const text = await response.text();
      try {
        return JSON.parse(text);
      } catch {
        throw new Error(response.ok
          ? "服务返回了无法识别的数据"
          : "解析服务暂时不可用（HTTP " + response.status + "），请稍后重试");
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (parsing) return;
      parsing = true;
      msg.innerHTML = "";
      result.hidden = true;
      go.disabled = true;
      go.textContent = "正在解析…";
      try {
        const submittedUrl = normalizeSubmittedUrl(urlEl.value);
        urlEl.value = submittedUrl;
        const r = await fetch("/api/parse", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: submittedUrl }),
        });
        const data = await readJsonResponse(r);
        if (!data.success) throw new Error(data.error || "解析失败");
        render(data.data);
      } catch (err) {
        msg.innerHTML = '<div class="error"><strong>暂时无法完成解析</strong>' + escapeHtml(err.message || err) + "</div>";
      } finally {
        parsing = false;
        go.disabled = false;
        go.textContent = "开始解析";
      }
    });

    function render(d) {
      const title = d.title || d.desc || "未命名作品";
      const play = d.url || "";
      const images = d.images || [];
      const platformName = String(d.platform || "").toLowerCase();
      const imagePrefix = platformName.includes("twitter") ? "x" : (platformName.includes("instagram") ? "instagram" : "douyin");
      const showsPlayCount = platformName.includes("tiktok") || platformName.includes("kuaishou");
      const avatar = d.avatar || "";
      const profile = d.profile_url || "";
      const authorName = d.uploader || "未知作者";
      const authorLinkStart = profile ? '<a href="' + escapeHtml(profile) + '" target="_blank" rel="noreferrer">' : "";
      const authorLinkEnd = profile ? "</a>" : "";
      const identifiers = [d.unique_id ? "@" + d.unique_id : "", d.uid ? "UID: " + d.uid : ""].filter(Boolean).join(" · ");
      const authorCard = (d.uploader || d.unique_id || d.uid || avatar || d.author_signature)
        ? '<div class="author-card">' +
          (avatar
            ? '<img class="avatar" src="' + escapeHtml(avatar) + '" alt="作者头像" referrerpolicy="no-referrer" />'
            : '<div class="avatar avatar-placeholder" aria-hidden="true">' + escapeHtml(authorName.slice(0, 1)) + "</div>") +
          '<div class="author-info"><div class="author-name">' + authorLinkStart + escapeHtml(authorName) + authorLinkEnd + "</div>" +
          (identifiers ? '<div class="author-id">' + escapeHtml(identifiers) + "</div>" : "") +
          (d.author_signature ? '<div class="author-signature">' + escapeHtml(d.author_signature) + "</div>" : "") +
          "</div></div>"
        : "";
      const statSource = [
        ...(showsPlayCount ? [["播放", d.play_count]] : []),
        ["点赞", d.digg_count],
        ["评论", d.comment_count],
        ["收藏", d.collect_count],
        ["分享", d.share_count],
      ];
      const stats = statSource
        .filter(([, value]) => value !== null && value !== undefined && value !== "")
        .map(([label, value]) => '<div class="stat"><strong title="' + escapeHtml(value) + '">' + formatCount(value) + '</strong><span>' + label + "</span></div>")
        .join("");
      const caption = d.desc
        ? '<div class="caption"><span class="caption-label">作品文案</span>' + escapeHtml(d.desc) + "</div>"
        : "";
      const formats = normalizeFormats(d.formats, play, d.duration, d.platform, d.http_headers);
      let selectedFormat = formats[0];
      const selectedPlay = formats[0]?.url || play;
      const media = images.length
        ? '<div class="gallery-head"><strong>作品图集</strong><span>共 ' + images.length + ' 张 · 可逐张下载原图</span></div><div class="gallery">' + images.map((u, index) =>
            '<figure class="gallery-item"><img src="' + escapeHtml(u) + '" alt="图集第 ' + (index + 1) + ' 张" loading="lazy" referrerpolicy="no-referrer" />' +
            '<span class="gallery-index">' + (index + 1) + ' / ' + images.length + '</span>' +
            '<a class="gallery-download" href="' + escapeHtml(streamUrl(u, true, null, imagePrefix + "-image-" + String(index + 1).padStart(2, "0"))) + '">下载第 ' + (index + 1) + ' 张原图</a></figure>'
          ).join("") + "</div>"
        : selectedPlay
          ? '<video id="preview-video" controls playsinline src="' + escapeHtml(streamUrl(selectedPlay, false, formats[0])) + '" poster="' + escapeHtml(d.thumbnail || "") + '"></video>'
          : (d.thumbnail ? '<img class="cover" src="' + escapeHtml(d.thumbnail) + '" alt="" referrerpolicy="no-referrer" />' : "");
      const qualityPicker = formats.length > 0
        ? '<div class="quality-picker"><div class="section-head"><div><h3>选择下载版本</h3><p>切换清晰度可同步更新预览与下载文件</p></div></div><div class="quality-buttons">' +
          formats.map((format, index) =>
            '<button type="button" class="quality-option' + (index === 0 ? " active" : "") + '" data-quality-index="' + index + '">' +
            '<span>' + escapeHtml(format.label) + '</span><small>' + escapeHtml(format.detailsLabel) + "</small></button>"
          ).join("") + "</div></div>"
        : "";
      const galleryPicker = images.length
        ? '<div class="quality-picker"><div class="section-head"><div><h3>选择下载版本</h3><p>默认打包下载全部原图，也可只保存图集背景音乐</p></div></div><div class="quality-buttons">' +
          '<button type="button" class="quality-option active" data-gallery-mode="images"><span>下载全部图片</span><small>' + images.length + ' 张原图 · ZIP 压缩包</small></button>' +
          '<button type="button" class="quality-option" data-gallery-mode="audio"' + (d.audio_url ? "" : " disabled") + '><span>下载音频文件</span><small>' + escapeHtml(d.audio_url ? (d.audio_title || "图集背景音乐") : "未获取到背景音乐") + '</small></button></div></div>'
        : "";
      const downloadPicker = images.length ? galleryPicker : qualityPicker;
      const galleryArchiveUrl = "/api/gallery-download?source=" + encodeURIComponent(d.source || "");
      const galleryAudioUrl = d.audio_url ? streamUrl(d.audio_url, true, null, imagePrefix + "-gallery-audio") : "";
      const dl = images.length
        ? '<a id="gallery-download-selected" class="primary" href="' + escapeHtml(galleryArchiveUrl) + '">下载全部图片</a>'
        : selectedPlay
          ? '<a id="download-selected" class="primary" href="' + escapeHtml(downloadUrl(d.source, formats[0])) + '">下载当前清晰度</a>'
          : "";
      const raw = !images.length && selectedPlay ? '<a id="raw-selected" class="ghost" href="' + escapeHtml(selectedPlay) + '" target="_blank" rel="noreferrer">打开媒体直链</a>' : "";
      result.innerHTML =
        '<div class="result-content"><div class="result-heading"><div class="meta">' +
        '<span class="platform-badge">' + escapeHtml(platformLabel(d.platform)) + "</span>" +
        '<h2>' + escapeHtml(title) + '</h2></div><span class="result-note">解析完成</span></div>' +
        authorCard + (stats ? '<div class="stats">' + stats + "</div>" : "") + caption + "</div>" +
        (media ? '<div class="media-shell">' + media + "</div>" : "") +
        '<div class="download-panel">' + downloadPicker + '<div class="actions">' + dl + raw + "</div></div>";
      result.hidden = false;

      const selectedDownload = document.getElementById("download-selected");
      if (selectedDownload) {
        selectedDownload.addEventListener("click", (event) => {
          if (!needsProgressDownload(d.source, selectedFormat)) return;
          event.preventDefault();
          startProgressDownload(d.source, selectedFormat);
        });
      }

      const galleryDownload = document.getElementById("gallery-download-selected");
      const galleryButtons = result.querySelectorAll("[data-gallery-mode]");
      galleryButtons.forEach((button) => {
        button.addEventListener("click", () => {
          if (button.disabled || !galleryDownload) return;
          galleryButtons.forEach((item) => item.classList.toggle("active", item === button));
          const audioMode = button.dataset.galleryMode === "audio";
          galleryDownload.href = audioMode ? galleryAudioUrl : galleryArchiveUrl;
          galleryDownload.textContent = audioMode ? "下载音频文件" : "下载全部图片";
        });
      });

      const qualityButtons = result.querySelectorAll("[data-quality-index]");
      qualityButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const selected = formats[Number(button.dataset.qualityIndex)];
          if (!selected) return;
          selectedFormat = selected;
          qualityButtons.forEach((item) => item.classList.toggle("active", item === button));
          const video = document.getElementById("preview-video");
          const download = document.getElementById("download-selected");
          const direct = document.getElementById("raw-selected");
          if (video) {
            video.pause();
            video.src = streamUrl(selected.url, false, selected);
            video.load();
          }
          if (download) download.href = downloadUrl(d.source, selected);
          if (direct) direct.href = selected.url;
        });
      });
    }

    function normalizeFormats(source, fallbackUrl, duration, platform, fallbackHeaders) {
      const seen = new Set();
      const grouped = new Map();
      for (const item of Array.isArray(source) ? source : []) {
        if (!item || !item.url || item.quality === "image" || item.vcodec === "none" || seen.has(item.url)) continue;
        seen.add(item.url);
        const key = formatGroupKey(item);
        const current = grouped.get(key);
        if (!current || isBetterFormat(item, current)) grouped.set(key, item);
      }
      const formats = Array.from(grouped.values()).map((item) => {
        const sizeLabel = formatSize(item, duration, platform);
        const dimensions = item.width || item.height
          ? [item.width, item.height].filter(Boolean).join(" × ")
          : "";
        const audioNote = item.acodec === "none"
          ? (item.format_id ? "下载时自动合并声音" : "不含声音")
          : "";
        return {
          ...item,
          label: formatLabel(item),
          sizeLabel,
          detailsLabel: [dimensions, sizeLabel, audioNote].filter(Boolean).join(" · "),
        };
      });
      formats.sort((a, b) => formatScore(b) - formatScore(a));
      const recommended = formats.findIndex((item) => item.url === fallbackUrl);
      if (recommended > 0) formats.unshift(formats.splice(recommended, 1)[0]);
      if (fallbackUrl && !seen.has(fallbackUrl)) {
        formats.unshift({
          url: fallbackUrl,
          label: "推荐版本",
          sizeLabel: "大小未知",
          detailsLabel: "大小未知",
          http_headers: fallbackHeaders || {},
        });
      }
      return formats;
    }

    function formatLabel(format) {
      const dimensions = [Number(format.width) || 0, Number(format.height) || 0].filter(Boolean);
      const height = dimensions.length ? normalizeResolution(Math.min(...dimensions)) : 0;
      const parts = height ? [height + "P"] : [];
      if (!dimensions.length && format.quality && format.quality !== "default") parts.push(format.quality);
      if (format.fps) parts.push(Math.round(Number(format.fps)) + " FPS");
      return parts.join(" · ") || "默认版本";
    }

    function normalizeResolution(height) {
      const standards = [2160, 1440, 1080, 720, 480, 360, 240];
      return standards.find((value) => Math.abs(value - height) <= Math.max(8, value * 0.015)) || height;
    }

    function platformLabel(platform) {
      const value = String(platform || "").toLowerCase();
      if (value.includes("douyin")) return "抖音";
      if (value.includes("kuaishou")) return "快手";
      if (value.includes("bilibili")) return "哔哩哔哩";
      if (value.includes("youtube")) return "YouTube";
      if (value.includes("tiktok")) return "TikTok";
      if (value === "x" || value.includes("twitter")) return "X";
      return platform || "已识别平台";
    }

    function formatGroupKey(format) {
      const width = Number(format.width) || 0;
      const height = Number(format.height) || 0;
      if (width || height) return "resolution:" + [width, height].sort((a, b) => a - b).join("x");
      return "quality:" + (format.quality || format.url);
    }

    function isBetterFormat(candidate, current) {
      const candidateScore = formatPreference(candidate);
      const currentScore = formatPreference(current);
      for (let index = 0; index < candidateScore.length; index += 1) {
        if (candidateScore[index] !== currentScore[index]) return candidateScore[index] > currentScore[index];
      }
      return false;
    }

    function formatPreference(format) {
      const hasAudio = format.acodec === "none" ? 0 : 1;
      const bytes = Number(format.filesize) || Number(format.filesize_approx) || 0;
      return [hasAudio, Number(format.fps) || 0, bytes, Number(format.tbr) || 0];
    }

    function formatScore(format) {
      return Math.max(Number(format.width) || 0, Number(format.height) || 0) * 1000000 + (Number(format.tbr) || 0);
    }

    function formatSize(format, duration, platform) {
      const exact = Number(format.filesize);
      if (Number.isFinite(exact) && exact > 0) return formatBytes(exact);
      let estimated = Number(format.filesize_approx);
      if (!(Number.isFinite(estimated) && estimated > 0)) {
        const bitRate = Number(format.tbr);
        const seconds = Number(duration);
        if (Number.isFinite(bitRate) && bitRate > 0 && Number.isFinite(seconds) && seconds > 0) {
          const bitsPerSecond = String(platform || "").toLowerCase().includes("douyin") || bitRate > 100000
            ? bitRate
            : bitRate * 1000;
          estimated = bitsPerSecond * seconds / 8;
        }
      }
      return Number.isFinite(estimated) && estimated > 0 ? "约 " + formatBytes(estimated) : "大小未知";
    }

    function formatBytes(bytes) {
      if (bytes >= 1024 ** 3) return (bytes / 1024 ** 3).toFixed(2).replace(/\.00$/, "") + " GB";
      if (bytes >= 1024 ** 2) return (bytes / 1024 ** 2).toFixed(1).replace(/\.0$/, "") + " MB";
      if (bytes >= 1024) return (bytes / 1024).toFixed(1).replace(/\.0$/, "") + " KB";
      return Math.round(bytes) + " B";
    }

    function formatCount(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return escapeHtml(value);
      if (number >= 100000000) return (number / 100000000).toFixed(number >= 1000000000 ? 0 : 1).replace(/\.0$/, "") + "亿";
      if (number >= 10000) return (number / 10000).toFixed(number >= 100000 ? 0 : 1).replace(/\.0$/, "") + "万";
      return new Intl.NumberFormat("zh-CN").format(number);
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    loadHealth();
  </script>
</body>
</html>
