<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">x-download</title>
  <desc id="desc">A local video parser and downloader for Douyin, TikTok, YouTube and more.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12110f"/>
      <stop offset="0.56" stop-color="#1d1915"/>
      <stop offset="1" stop-color="#2b1d14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffae70"/>
      <stop offset="1" stop-color="#e06c2f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1080" cy="40" r="230" fill="#e97938" opacity=".08"/>
  <circle cx="1050" cy="310" r="170" fill="#ffb378" opacity=".05"/>

  <g transform="translate(72 72)">
    <rect width="142" height="142" rx="38" fill="#211a15" stroke="#6f4931" filter="url(#shadow)"/>
    <circle cx="71" cy="71" r="48" fill="url(#accent)"/>
    <path d="M59 48 96 71 59 94Z" fill="#18120e"/>
    <path d="M71 112v35m0 0-15-15m15 15 15-15" fill="none" stroke="#f5e9df" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(252 78)" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text y="64" fill="#fff8f1" font-size="66" font-weight="750" letter-spacing="-2">x-download</text>
    <text y="108" fill="#b8aaa0" font-size="23">本地视频解析 · 清晰度选择 · 一键下载</text>
    <g transform="translate(0 142)" font-size="16" font-weight="600">
      <g><rect width="96" height="38" rx="19" fill="#2a241f" stroke="#4b4037"/><text x="48" y="25" fill="#f4e8de" text-anchor="middle">抖音</text></g>
      <g transform="translate(108)"><rect width="100" height="38" rx="19" fill="#2a241f" stroke="#4b4037"/><text x="50" y="25" fill="#f4e8de" text-anchor="middle">TikTok</text></g>
      <g transform="translate(220)"><rect width="112" height="38" rx="19" fill="#2a241f" stroke="#4b4037"/><text x="56" y="25" fill="#f4e8de" text-anchor="middle">YouTube</text></g>
      <g transform="translate(344)"><rect width="126" height="38" rx="19" fill="#2a241f" stroke="#4b4037"/><text x="63" y="25" fill="#f4e8de" text-anchor="middle">yt-dlp</text></g>
    </g>
  </g>

  <g transform="translate(880 96)" filter="url(#shadow)">
    <rect width="242" height="168" rx="22" fill="#f8eee6"/>
    <rect x="22" y="23" width="198" height="16" rx="8" fill="#dcc9bb"/>
    <rect x="22" y="55" width="148" height="12" rx="6" fill="#eadbd0"/>
    <rect x="22" y="91" width="92" height="50" rx="14" fill="url(#accent)"/>
    <rect x="126" y="91" width="94" height="50" rx="14" fill="#e8d8cc"/>
    <path d="m56 111 12 10 22-24" fill="none" stroke="#271810" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
